[package]
name = "meal-desktop-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "meal_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 👇 Hacky pinning for Ubuntu 20.04 (glib 2.64.6 support)
glib-sys = "=0.15.10"
gobject-sys = "=0.15.10"
gio-sys = "=0.15.10"